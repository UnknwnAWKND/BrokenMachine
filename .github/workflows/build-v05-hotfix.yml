name: Build Windows VST3 v0.5.0 Hotfix

on:
  workflow_dispatch:
  push:
    branches: [ "v0.5-ux-clarity" ]
    paths:
      - ".github/workflows/build-v05-hotfix.yml"

permissions:
  contents: read
  issues: write

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct canonical v0.5 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $yaml = Get-Content ".github/workflows/build-v05.yml" -Raw
          $m = [regex]::Match($yaml, '(?ms)^      - name: Reconstruct verified v0\.5 source\r?\n.*?^        run: \|\r?\n(?<script>.*?)(?=^      - name: Configure VS2022 x64)')
          if (-not $m.Success) { throw "Could not extract canonical reconstruction script" }
          $lines = $m.Groups['script'].Value -split "`r?`n"
          $script = ($lines | ForEach-Object { if ($_.StartsWith('          ')) { $_.Substring(10) } else { $_ } }) -join "`n"
          $script = $script.Replace('--exclude="BUILD_STATUS.md"', '--exclude="*BUILD_STATUS.md"')
          $script = $script.Replace(',"MACHINE MONITOR"', '')
          $script = $script.Replace(',"PREAMP > MODELER > REVERB"', '')
          Set-Content reconstruct.ps1 $script
          & ./reconstruct.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure VS2022 x64
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 Release
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: cmake --build build --config Release --target BrokenMachine_VST3 --parallel

      - name: Audit and package
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: |
          $ErrorActionPreference = "Stop"
          $header = Get-Content "Source\Parameters\Parameters.h" -Raw
          $ids = [regex]::Matches($header, 'inline constexpr auto\s+(\w+)\s*=') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if ($ids.Count -ne 74) { throw "Expected 74 parameter IDs, found $($ids.Count)" }
          $refs = @()
          Get-ChildItem Source -Recurse -Include *.cpp,*.h | ForEach-Object {
            $t = Get-Content $_.FullName -Raw
            [regex]::Matches($t, 'Params::ID::(\w+)') | ForEach-Object { $refs += $_.Groups[1].Value }
          }
          $undefined = @($refs | Sort-Object -Unique | Where-Object { $_ -notin $ids })
          if ($undefined.Count) { throw "Undefined parameter refs: $($undefined -join ', ')" }
          $processor = Get-Content "Source\PluginProcessor.cpp" -Raw
          foreach ($route in @("case 0:","case 1:","case 2:","case 3:")) { if (-not $processor.Contains($route)) { throw "Missing route $route" } }
          foreach ($preset in @("Soft Focus","Baritone Wire","Distorted Halo","Synthetic Wire","Hairline","Ghost Bloom","Unstable Clean","Machine Collapse")) { if (-not $processor.Contains($preset)) { throw "Missing factory tone $preset" } }
          $editor = Get-Content "Source\PluginEditor.cpp" -Raw
          foreach ($marker in @("INPUT TYPE","SIGNAL ORDER","PICK RESPONSE","SUSTAIN + REVERB","HELP MODE")) { if (-not $editor.Contains($marker)) { throw "Missing UI marker $marker" } }
          if ($editor.Contains("VARIATION") -or $editor.Contains("DEEP EDIT")) { throw "Legacy Variation/Deep Edit UI still present" }
          $monitor = Get-Content "Source\UI\MachineMonitor.cpp" -Raw
          foreach ($marker in @("performFrequencyOnlyForwardTransform","FX ENERGY","PITCH MOVE","PREAMP  >  MODELER  >  REVERB")) { if (-not $monitor.Contains($marker)) { throw "Missing monitor marker $marker" } }

          $vst3 = Get-ChildItem build -Recurse -Directory -Filter "Broken Machine.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 bundle not found" }
          $bin = Get-ChildItem $vst3.FullName -Recurse -File | Where-Object { $_.Name -eq "Broken Machine.vst3" -or $_.Extension -eq ".dll" } | Select-Object -First 1
          if (-not $bin) { throw "VST3 binary not found" }
          $bytes = [IO.File]::ReadAllBytes($bin.FullName)
          $pe = [BitConverter]::ToInt32($bytes,0x3c)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a -or [BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x8664) { throw "Binary is not PE32+ x86-64" }
          $vi = (Get-Item $bin.FullName).VersionInfo
          $version = if ($vi.ProductVersion) { $vi.ProductVersion } else { $vi.FileVersion }
          if (-not $version.StartsWith("0.5.0")) { throw "Unexpected version $version" }
          $module = Get-ChildItem $vst3.FullName -Recurse -File -Filter "moduleinfo.json" | Select-Object -First 1
          if (-not $module -or -not (Get-Content $module.FullName -Raw).Contains('"Version": "0.5.0"')) { throw "moduleinfo version mismatch" }
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($s in @("GetPluginFactory","InitDll","ExitDll","INPUT TYPE","SIGNAL ORDER","MACHINE MONITOR","PICK RESPONSE")) { if (-not $ascii.Contains($s)) { throw "Missing binary marker $s" } }
          $binHash = (Get-FileHash $bin.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @("Broken Machine v0.5.0 validation","PE32+ x86-64","Version: $version","Binary SHA-256: $binHash","74 parameter IDs; four routing paths; v0.5 UI markers verified") | Set-Content BINARY_VALIDATION.txt
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $vst3.FullName "package\Broken Machine.vst3" -Recurse
          Copy-Item INSTALL.txt package\INSTALL.txt
          if (Test-Path RESEARCH.md) { Copy-Item RESEARCH.md package\RESEARCH.md }
          Copy-Item BINARY_VALIDATION.txt package\BINARY_VALIDATION.txt
          Compress-Archive "package\*" "BrokenMachine-v0.5.0-Windows-VST3.zip" -Force
          Write-Host "Validated v0.5.0 binary SHA-256: $binHash"

      - name: Package clean source
        shell: pwsh
        run: |
          $src = (Resolve-Path "source-root\BrokenMachine-v0.3").Path
          $dst = Join-Path (Get-Location) "source-package\BrokenMachine-v0.5.0"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Get-ChildItem $src -Recurse -File | Where-Object { $_.FullName -notmatch '\\build\\|\\package\\' -and $_.Extension -notin @('.log','.zip','.obj','.pdb','.dll','.exe') -and $_.Name -ne 'BINARY_VALIDATION.txt' } | ForEach-Object {
            $rel = $_.FullName.Substring($src.Length + 1)
            $target = Join-Path $dst $rel
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $_.FullName $target
          }
          Compress-Archive "source-package\BrokenMachine-v0.5.0" "BrokenMachine-v0.5.0-source.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BrokenMachine-v0.5.0-Windows-VST3
          path: source-root/BrokenMachine-v0.3/BrokenMachine-v0.5.0-Windows-VST3.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: BrokenMachine-v0.5.0-Source
          path: BrokenMachine-v0.5.0-source.zip
          if-no-files-found: error

      - name: Report result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $result = "${{ job.status }}"
          gh issue create --title "v0.5.0 HOTFIX build $result" --body "Run ID: ${{ github.run_id }}`nCommit: ${{ github.sha }}"

# trigger existing workflow

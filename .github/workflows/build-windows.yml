name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "source_chunks/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read
  issues: write

jobs:
  build-windows-vst3:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and extract verified source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            Remove-Item "build-error.txt" -ErrorAction SilentlyContinue

            $parts = Get-ChildItem -Path "source_chunks" -Filter "part*.txt" | Sort-Object Name
            if ($parts.Count -ne 2) {
              throw "Expected exactly 2 source chunks but found $($parts.Count)."
            }

            $encoded = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "").Trim()
            if ([string]::IsNullOrWhiteSpace($encoded)) {
              throw "Reconstructed base64 source text is empty."
            }

            try {
              $archiveBytes = [System.Convert]::FromBase64String($encoded)
            }
            catch {
              throw "Source chunks could not be base64-decoded: $($_.Exception.Message)"
            }

            $archivePath = "BrokenMachine-source.tar.xz"
            [System.IO.File]::WriteAllBytes($archivePath, $archiveBytes)

            $expectedHash = "c351ffb2ae7fd51349a4d4c2d1e2782939c9b70b2ac91d1c72491fada74a6bcd"
            $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Source archive SHA256: $actualHash"

            if ($actualHash -ne $expectedHash) {
              throw "Source archive hash mismatch. Expected $expectedHash but got $actualHash."
            }

            New-Item -ItemType Directory -Force -Path "source" | Out-Null
            & python -c "import tarfile; t=tarfile.open(r'BrokenMachine-source.tar.xz', 'r:xz'); t.extractall(r'source'); t.close()"
            if ($LASTEXITCODE -ne 0) {
              throw "Python failed to extract the verified tar.xz source archive. Exit code: $LASTEXITCODE"
            }

            if (-not (Test-Path "source\BrokenMachine\CMakeLists.txt")) {
              Write-Host "Extracted directory listing:"
              Get-ChildItem -Path source -Recurse -Depth 2 | Select-Object FullName | Format-Table -AutoSize
              throw "Source archive extracted, but source\BrokenMachine\CMakeLists.txt was not found."
            }

            Write-Host "Verified source project reconstructed successfully."
          }
          catch {
            @(
              "Stage: source reconstruction / extraction"
              "Message: $($_.Exception.Message)"
              ""
              "PowerShell details:"
              ($_ | Out-String)
            ) | Set-Content "build-error.txt"
            throw
          }

      - name: Configure
        shell: pwsh
        working-directory: source/BrokenMachine
        run: |
          $ErrorActionPreference = "Continue"
          & cmake -S . -B build -G "Visual Studio 17 2022" -A x64 *> configure.log
          $code = $LASTEXITCODE
          Get-Content configure.log
          if ($code -ne 0) {
            @(
              "Stage: CMake configure"
              "Exit code: $code"
              ""
              "Last configure log lines:"
              (Get-Content configure.log -Tail 200)
            ) | Set-Content "..\..\build-error.txt"
            exit $code
          }

      - name: Build VST3
        shell: pwsh
        working-directory: source/BrokenMachine
        run: |
          $ErrorActionPreference = "Continue"
          & cmake --build build --config Release --target BrokenMachine_VST3 --parallel *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log
          if ($code -ne 0) {
            @(
              "Stage: C++ / VST3 compilation"
              "Exit code: $code"
              ""
              "Last compiler log lines:"
              (Get-Content build.log -Tail 250)
            ) | Set-Content "..\..\build-error.txt"
            exit $code
          }

      - name: Package VST3
        shell: pwsh
        working-directory: source/BrokenMachine
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "Broken Machine.vst3" | Select-Object -First 1
            if (-not $vst3) { throw "Built VST3 bundle was not found." }

            New-Item -ItemType Directory -Force -Path package | Out-Null
            Copy-Item -Path $vst3.FullName -Destination "package\Broken Machine.vst3" -Recurse
            Copy-Item -Path "INSTALL.txt" -Destination "package\INSTALL.txt"
            Compress-Archive -Path "package\*" -DestinationPath "BrokenMachine-Windows-VST3.zip" -Force
          }
          catch {
            @(
              "Stage: VST3 packaging"
              "Message: $($_.Exception.Message)"
              ""
              ($_ | Out-String)
            ) | Set-Content "..\..\build-error.txt"
            throw
          }

      - name: Upload downloadable plugin
        uses: actions/upload-artifact@v4
        with:
          name: BrokenMachine-Windows-VST3
          path: source/BrokenMachine/BrokenMachine-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Report build failure for ChatGPT debugging
        if: ${{ failure() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path "build-error.txt")) {
            "Build failed, but the failing action did not create a detailed build-error.txt file. Inspect run ${{ github.run_id }}." | Set-Content "build-error.txt"
          }

          $header = @"
          Automated BrokenMachine Windows VST3 build failed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}
          Attempt: ${{ github.run_attempt }}

          "@

          $body = $header + (Get-Content "build-error.txt" -Raw)
          $body | Set-Content "failure-body.txt"
          gh issue create --title "Windows VST3 build failure #${{ github.run_number }}" --body-file "failure-body.txt"

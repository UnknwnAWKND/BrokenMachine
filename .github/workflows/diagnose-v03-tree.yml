name: Diagnose v0.3 transferred source tree
on:
  push:
    branches: [ "v0.3-tone-overhaul" ]
    paths: [ ".github/workflows/diagnose-v03-tree.yml" ]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Extract and collect file hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = @(
            "v0.3-source-chunks/BrokenMachine-v0.3-source.b64.part01",
            "v0.3-source-chunks/BrokenMachine-v0.3-source.b64.part02",
            "v0.3-source-chunks/BrokenMachine-v0.3-source.b64.part03",
            "v0.3-source-chunks/BrokenMachine-v0.3-source.b64.part04"
          )
          $encoded = (($parts | ForEach-Object { Get-Content $_ -Raw }) -join "").Trim()
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($encoded))
          New-Item -ItemType Directory -Force source-root | Out-Null
          Expand-Archive source.zip -DestinationPath source-root -Force
          $root = (Resolve-Path "source-root/BrokenMachine-v0.3").Path
          $files = @(Get-ChildItem $root -Recurse -File)
          $rels = @($files | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\','/') })
          [Array]::Sort($rels, [StringComparer]::Ordinal)
          "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" | Set-Content hashes.txt
          "FILE_COUNT=$($rels.Count)" | Add-Content hashes.txt
          foreach ($rel in $rels) {
            $hash = (Get-FileHash (Join-Path $root $rel.Replace('/','\')) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $rel" | Add-Content hashes.txt
          }
          Get-Content hashes.txt
      - name: Report hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "v0.3 transferred source hash diagnosis #${{ github.run_number }}" --body-file hashes.txt

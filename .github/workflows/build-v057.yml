name: Build Windows VST3 v0.5.7

on:
  workflow_dispatch:
  push:
    branches:
      - v0.5.7
    paths:
      - "patches/v0.5.7-source-overlay.zip.b64"
      - ".github/workflows/build-v057.yml"

permissions:
  contents: read

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.5.2 source base
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $yaml = Get-Content ".github/workflows/build-v05-hotfix.yml" -Raw
          $m = [regex]::Match($yaml, '(?ms)^      - name: Reconstruct v0\.5\.1 and apply verified v0\.5\.2\r?\n.*?^        run: \|\r?\n(?<script>.*?)(?=^      - name: Static UI and compatibility audit)')
          if (-not $m.Success) { throw "Could not extract verified v0.5.2 base reconstruction step" }
          $lines = $m.Groups['script'].Value -split "`r?`n"
          $script = ($lines | ForEach-Object { if ($_.StartsWith('          ')) { $_.Substring(10) } else { $_ } }) -join "`n"
          Set-Content reconstruct-v052.ps1 $script
          & ./reconstruct-v052.ps1
          if ($LASTEXITCODE -ne 0) { throw "v0.5.2 base reconstruction failed: $LASTEXITCODE" }

      - name: Install verified v0.5.5 source overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "source-root\BrokenMachine-v0.3").Path

          function Get-DspManifestHash([string]$projectRoot) {
            $files = @(Get-ChildItem (Join-Path $projectRoot "Source\DSP") -Recurse -File)
            $rels = @($files | ForEach-Object { $_.FullName.Substring($projectRoot.Length + 1).Replace('\','/') })
            [Array]::Sort($rels, [StringComparer]::Ordinal)
            $manifest = ""
            foreach ($rel in $rels) {
              $h = (Get-FileHash (Join-Path $projectRoot $rel.Replace('/','\')) -Algorithm SHA256).Hash.ToLowerInvariant()
              $manifest += "$h  $rel`n"
            }
            return ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($manifest)))).Replace('-','').ToLowerInvariant()
          }

          $dspBefore = Get-DspManifestHash $root
          $transport = (Get-Content "patches\v0.5.5-source-overlay.zip.b64" -Raw).Trim()
          if ($transport.Length -ne 40428) { throw "v0.5.5 payload length $($transport.Length), expected 40428" }
          $transportHash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($transport)))).Replace('-','').ToLowerInvariant()
          if ($transportHash -ne "08f9f3eac1aec4bc99d240886d6b0e34a17cb658694a800ebe729e2a451f654a") {
            throw "v0.5.5 transport hash mismatch: $transportHash"
          }

          [IO.File]::WriteAllBytes("v0.5.5-source-overlay.zip", [Convert]::FromBase64String($transport))
          $zipHash = (Get-FileHash "v0.5.5-source-overlay.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne "31e3101ecda3e8edf8c1778afd232df48f7a6dac90709797bdb3461d10aeeb8f") {
            throw "v0.5.5 source ZIP hash mismatch: $zipHash"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "v0.5.5-source-overlay.zip").Path)
          try {
            $entries = @($zip.Entries | Where-Object { $_.Name } | ForEach-Object { $_.FullName.Replace('\','/') } | Sort-Object)
          } finally {
            $zip.Dispose()
          }
          $allowed = @(
            "CMakeLists.txt",
            "Source/Parameters/Parameters.cpp",
            "Source/Parameters/Parameters.h",
            "Source/PluginEditor.cpp",
            "Source/PluginEditor.h",
            "Source/PluginProcessor.cpp",
            "Source/PluginProcessor.h",
            "Source/UI/CustomLookAndFeel.cpp",
            "Source/UI/CustomLookAndFeel.h"
          ) | Sort-Object
          if (($entries -join "`n") -ne ($allowed -join "`n")) {
            throw "Unexpected v0.5.5 archive paths: $($entries -join ', ')"
          }

          Expand-Archive "v0.5.5-source-overlay.zip" -DestinationPath $root -Force
          $dspAfter = Get-DspManifestHash $root
          if ($dspAfter -ne $dspBefore) { throw "DSP implementation files changed: $dspBefore -> $dspAfter" }
          @(
            "v0.5.5 source overlay SHA-256: $zipHash",
            "DSP directory manifest unchanged: $dspAfter"
          ) | Set-Content source-validation.txt
          Get-Content source-validation.txt

      - name: Install verified v0.5.6 source overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "source-root\BrokenMachine-v0.3").Path
          $transport = (Get-Content "patches\v0.5.6-source-overlay.zip.b64" -Raw).Trim()
          if ($transport.Length -ne 54088) { throw "v0.5.6 payload length $($transport.Length), expected 54088" }
          $transportHash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($transport)))).Replace('-','').ToLowerInvariant()
          if ($transportHash -ne "163682a91ad8eabc022a9f9d08fe39497c2812531fe0d8652f3435bf5fd5fa52") {
            throw "v0.5.6 transport hash mismatch: $transportHash"
          }

          [IO.File]::WriteAllBytes("v0.5.6-source-overlay.zip", [Convert]::FromBase64String($transport))
          $zipHash = (Get-FileHash "v0.5.6-source-overlay.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne "3c339fa29f25346534f4a96f5ce9725d457c3a80a074fd2757463e5a41975a64") {
            throw "v0.5.6 source ZIP hash mismatch: $zipHash"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "v0.5.6-source-overlay.zip").Path)
          try {
            $entries = @($zip.Entries | Where-Object { $_.Name } | ForEach-Object { $_.FullName.Replace('\','/') } | Sort-Object)
          } finally {
            $zip.Dispose()
          }
          $allowed = @(
            "CMakeLists.txt",
            "README.md",
            "Source/DSP/GhostProcessor.cpp",
            "Source/DSP/Saturator.cpp",
            "Source/DSP/Saturator.h",
            "Source/DSP/SpatialProcessor.cpp",
            "Source/DSP/SpatialProcessor.h",
            "Source/DSP/Tremolo.cpp",
            "Source/DSP/Tremolo.h",
            "Source/DSP/WowFlutter.cpp",
            "Source/DSP/WowFlutter.h",
            "Source/Parameters/Parameters.cpp",
            "Source/Parameters/Parameters.h",
            "Source/PluginEditor.cpp",
            "Source/PluginEditor.h",
            "Source/PluginProcessor.cpp",
            "Source/PluginProcessor.h"
          ) | Sort-Object
          if (($entries -join "`n") -ne ($allowed -join "`n")) {
            throw "Unexpected v0.5.6 archive paths: $($entries -join ', ')"
          }

          Expand-Archive "v0.5.6-source-overlay.zip" -DestinationPath $root -Force
          @(
            "v0.5.6 source overlay SHA-256: $zipHash",
            "v0.5.6 transport SHA-256: $transportHash",
            "Verified overlay entries: $($entries.Count)"
          ) | Set-Content source-validation-v056.txt
          Get-Content source-validation-v056.txt

      - name: Install v0.5.7 size and preset-management overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "source-root\BrokenMachine-v0.3").Path

          function Get-ProtectedManifestHash([string]$projectRoot) {
            $files = @(
              Get-ChildItem (Join-Path $projectRoot "Source\DSP") -Recurse -File
              Get-ChildItem (Join-Path $projectRoot "Source\Parameters") -Recurse -File
            )
            $rels = @($files | ForEach-Object { $_.FullName.Substring($projectRoot.Length + 1).Replace('\','/') })
            [Array]::Sort($rels, [StringComparer]::Ordinal)
            $manifest = ""
            foreach ($rel in $rels) {
              $h = (Get-FileHash (Join-Path $projectRoot $rel.Replace('/','\')) -Algorithm SHA256).Hash.ToLowerInvariant()
              $manifest += "$h  $rel`n"
            }
            return ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($manifest)))).Replace('-','').ToLowerInvariant()
          }

          function Get-ProcessBlockHash([string]$projectRoot) {
            $processor = Get-Content (Join-Path $projectRoot "Source\PluginProcessor.cpp") -Raw
            $match = [regex]::Match($processor, '(?s)void BrokenMachineAudioProcessor::processBlock.*?(?=void BrokenMachineAudioProcessor::getStateInformation)')
            if (-not $match.Success) { throw "Could not isolate processBlock before v0.5.7 overlay" }
            return ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($match.Value)))).Replace('-','').ToLowerInvariant()
          }

          $protectedBefore = Get-ProtectedManifestHash $root
          $processBefore = Get-ProcessBlockHash $root

          $transport = (Get-Content "patches\v0.5.7-source-overlay.zip.b64" -Raw).Trim()
          if ($transport.Length -ne 33796) { throw "v0.5.7 payload length $($transport.Length), expected 33796" }
          $transportHash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($transport)))).Replace('-','').ToLowerInvariant()
          if ($transportHash -ne "ea59c65f6fc80c05db39130e313f7cca8c5736ba16d7b9efd2925218e75d4e5f") {
            throw "v0.5.7 transport hash mismatch: $transportHash"
          }

          [IO.File]::WriteAllBytes("v0.5.7-source-overlay.zip", [Convert]::FromBase64String($transport))
          $zipHash = (Get-FileHash "v0.5.7-source-overlay.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne "68cb41d2f039180aae8acf53136c1b114ae3c125f3625da69f5bbc0cd3de5353") {
            throw "v0.5.7 source ZIP hash mismatch: $zipHash"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "v0.5.7-source-overlay.zip").Path)
          try {
            $entries = @($zip.Entries | Where-Object { $_.Name } | ForEach-Object { $_.FullName.Replace('\','/') } | Sort-Object)
          } finally {
            $zip.Dispose()
          }
          $allowed = @(
            "CMakeLists.txt",
            "README.md",
            "Source/PluginEditor.cpp",
            "Source/PluginEditor.h",
            "Source/PluginProcessor.cpp",
            "Source/PluginProcessor.h"
          ) | Sort-Object
          if (($entries -join "`n") -ne ($allowed -join "`n")) {
            throw "Unexpected v0.5.7 archive paths: $($entries -join ', ')"
          }

          Expand-Archive "v0.5.7-source-overlay.zip" -DestinationPath $root -Force

          $protectedAfter = Get-ProtectedManifestHash $root
          $processAfter = Get-ProcessBlockHash $root
          if ($protectedAfter -ne $protectedBefore) {
            throw "DSP/parameter manifest changed: $protectedBefore -> $protectedAfter"
          }
          if ($processAfter -ne $processBefore) {
            throw "processBlock changed: $processBefore -> $processAfter"
          }

          @(
            "v0.5.7 source overlay SHA-256: $zipHash",
            "v0.5.7 transport SHA-256: $transportHash",
            "Verified overlay entries: $($entries.Count)",
            "DSP/parameter manifest unchanged: $protectedAfter",
            "processBlock unchanged: $processAfter"
          ) | Set-Content source-validation-v057.txt
          Get-Content source-validation-v057.txt

      - name: Static v0.5.7 UI preset and compatibility audit
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: |
          $ErrorActionPreference = "Stop"
          $cmake = Get-Content "CMakeLists.txt" -Raw
          if (-not $cmake.Contains("VERSION 0.5.7")) { throw "CMake version is not 0.5.7" }
          if (-not $cmake.Contains('COMPANY_NAME "UnknwnAWKND"')) { throw "Vendor metadata changed" }
          if (-not $cmake.Contains("Source/DSP/Tremolo.cpp")) { throw "Tremolo source is not compiled" }
          if ($cmake.Contains("Source/DSP/FeedbackResonator.cpp")) { throw "Removed FeedbackResonator is still compiled" }

          $editor = Get-Content "Source\PluginEditor.cpp" -Raw
          $header = Get-Content "Source\PluginEditor.h" -Raw
          $laf = Get-Content "Source\UI\CustomLookAndFeel.cpp" -Raw
          $allUi = $editor + "`n" + $header + "`n" + $laf
          foreach ($marker in @(
            "setResizeLimits (1050, 700, 1700, 1150)",
            "setSize (1050, 700)",
            'statusLabel.setText ("v0.5.7  /  USER PRESETS"',
            "startupSizeTicks == 2",
            "startupSizeTicks == 9",
            "slider.setTextBoxStyle (juce::Slider::TextBoxBelow, false, 88, 22)",
            "Rectangle<int> (88, 78)",
            "const std::array<int, 8> columns { 1, 3, 3, 1, 4, 3, 3, 1 }",
            "uiFont (16.5f, juce::Font::bold)",
            "diameter / 68.0f",
            'getProperties().set ("bmCardPower", true)',
            "DYNAMIC FX SENSITIVITY",
            "LOW FREQ PROTECTION",
            "HIGH FREQ PROTECTION",
            "REVERB + GHOST",
            "TREMOLO DEPTH",
            "TREMOLO RATE",
            "DOUBLE",
            "TONE + SPEAKER",
            "SYNTH / MODEL",
            "LINK DOUBLE L/R",
            'deleteConfirmationEditor.getText().trim() == "delete"',
            "confirmDeleteButton.setEnabled (false)",
            "DELETE USER PRESET"
          )) {
            if (-not $allUi.Contains($marker)) { throw "Missing v0.5.7 UI marker '$marker'" }
          }

          foreach ($removed in @("MORE","detailKnobs","showingDetail","backButton","descriptorLabel","moreButton","showModuleDetail")) {
            if ($allUi.Contains($removed)) { throw "Removed secondary-page/descriptor marker remains: $removed" }
          }
          if ([regex]::IsMatch($allUi, 'uiFont\s*\((?:[0-9]|1[01])(?:\.\d+)?f')) {
            throw "Sub-12px control text remains"
          }

          $bindings = @([regex]::Matches($editor, 'addModuleKnob \([^\r\n]+Params::ID::(\w+)') | ForEach-Object { $_.Groups[1].Value })
          if ($bindings.Count -ne 45) { throw "Expected 45 one-page knob bindings, found $($bindings.Count)" }
          if (($bindings | Sort-Object -Unique).Count -ne 45) { throw "One-page knob bindings contain duplicates" }
          $moduleCounts = @{
            inputModule = 2; compressionModule = 6; driveModule = 8; modelModule = 3;
            reverbModule = 10; pitchModule = 6; toneModule = 8; outputModule = 2
          }
          foreach ($name in $moduleCounts.Keys) {
            $count = [regex]::Matches($editor, "addModuleKnob \($name,").Count
            if ($count -ne $moduleCounts[$name]) { throw "$name has $count controls, expected $($moduleCounts[$name])" }
          }
          foreach ($retired in @(
            "punch","bloom","brightness","highBreakup","flutter","drift","damage",
            "detuneCents","offsetMs","bodyFreqHz","biteFreqHz","feedbackRes",
            "feedbackFreqHz","feedbackHold","darkness"
          )) {
            if ($bindings -contains $retired) { throw "Retired knob remains visible: $retired" }
          }

          $paramsHeader = Get-Content "Source\Parameters\Parameters.h" -Raw
          $params = Get-Content "Source\Parameters\Parameters.cpp" -Raw
          $ids = @([regex]::Matches($paramsHeader, 'inline constexpr auto\s+(\w+)\s*=') | ForEach-Object { $_.Groups[1].Value })
          if ($ids.Count -ne 84 -or ($ids | Sort-Object -Unique).Count -ne 84) { throw "Expected 84 unique parameter IDs" }
          $layoutIds = @([regex]::Matches($params, '(?:fparam|cparam) \(ID::(\w+)|ParameterID \{ ID::(\w+), 1 \}') | ForEach-Object {
            if ($_.Groups[1].Success) { $_.Groups[1].Value } else { $_.Groups[2].Value }
          })
          if ($layoutIds.Count -ne 84) { throw "Expected 84 layout parameters, found $($layoutIds.Count)" }
          $expectedLegacy = "inputDb,diCharacter,inputProfile,topology,compress,punch,crush,threshold,ratio,attackMs,releaseMs,makeupDb,kneeDb,transientSense,sustainSense,drive,bias,texture,sag,portaTrim,portaChannel,portaMaster,portaBassDb,portaTrebleDb,lowTight,highBreakup,wow,flutter,drift,damage,doubleMix,detuneCents,offsetMs,spread,driftLink,lowCutHz,highCutHz,body,bodyFreqHz,bite,biteFreqHz,resonance,formant,speaker,size,space,slapMs,feedback,width,darkness,smear,reverbDrive,reverbGate,reverbDuck,wetCompress,wetTone,wetBias,ghost,ghostSizeMs,modelMix,modelColor,modelMotion,feedbackRes,feedbackFreqHz,feedbackHold,react,broken,brightness,bloom,weird,mix,outputDb,autoGain,safe,compressionEnabled,driveEnabled,reverbEnabled,pitchEnabled,toneEnabled"
          if (($layoutIds[0..78] -join ",") -ne $expectedLegacy) { throw "Legacy parameter order changed" }
          if (($layoutIds[79..83] -join ",") -ne "highProtect,reverbHighCutHz,tremoloDepth,tremoloRateHz,modelEnabled") {
            throw "v0.5.6 parameters were not appended in the expected order"
          }

          $processor = Get-Content "Source\PluginProcessor.cpp" -Raw
          $processorHeader = Get-Content "Source\PluginProcessor.h" -Raw
          $processMatch = [regex]::Match($processor, '(?s)void BrokenMachineAudioProcessor::processBlock.*?(?=void BrokenMachineAudioProcessor::getStateInformation)')
          if (-not $processMatch.Success) { throw "Could not isolate processBlock" }
          $process = $processMatch.Value
          foreach ($retired in @(
            "punch","bloom","brightness","highBreakup","flutter","drift","damage",
            "detuneCents","offsetMs","bodyFreqHz","biteFreqHz","feedbackRes",
            "feedbackFreqHz","feedbackHold","darkness"
          )) {
            if ([regex]::IsMatch($process, "value \(Params::ID::$retired\)")) {
              throw "Retired parameter still drives processBlock: $retired"
            }
          }
          foreach ($marker in @(
            "modelCardMix","Params::ID::modelEnabled","tremolo.process",
            "Params::ID::highProtect","Params::ID::reverbHighCutHz",
            "ds.detuneCents = 7.0f","ds.offsetMs = 8.0f",
            "ts.bodyFreqHz = 680.0f","ts.biteFreqHz = 2350.0f",
            "stateContainsParameter","saveUserPreset","loadUserPreset","deleteUserPreset",
            "Afterglow Signal","Deep Halo","Ghost Chamber"
          )) {
            if (-not (($processor + "`n" + $processorHeader).Contains($marker))) { throw "Missing processor marker '$marker'" }
          }
          if ([regex]::Matches($editor, 'Params::ID::(?:compression|drive|model|reverb|pitch|tone)Enabled').Count -ne 6) {
            throw "Expected six effect-card bypass attachments"
          }
          foreach ($marker in @(
            'confirmationText.trim() != "delete"',
            "file.deleteFile()",
            "matchesPresetName",
            "deletePresetButton.setEnabled (hasSelection)"
          )) {
            if (-not (($processor + "`n" + $editor).Contains($marker))) {
              throw "Missing protected preset-delete marker '$marker'"
            }
          }

          $ghost = Get-Content "Source\DSP\GhostProcessor.cpp" -Raw
          $spatial = Get-Content "Source\DSP\SpatialProcessor.cpp" -Raw
          $pitch = Get-Content "Source\DSP\WowFlutter.cpp" -Raw
          $sat = Get-Content "Source\DSP\Saturator.cpp" -Raw
          foreach ($check in @(
            @{ Text = $ghost; Marker = "400.0f" },
            @{ Text = $ghost; Marker = "0.75f * amount * amount * amount" },
            @{ Text = $spatial; Marker = "pow (wetDrive, 4.0f) * 12.0f" },
            @{ Text = $spatial; Marker = "s.highCutHz" },
            @{ Text = $pitch; Marker = "instabilityDepthMs" },
            @{ Text = $sat; Marker = "highProtected * highProtect" }
          )) {
            if (-not $check.Text.Contains($check.Marker)) { throw "Missing DSP marker '$($check.Marker)'" }
          }

      - name: Configure VS2022 x64
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 Release
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: cmake --build build --config Release --target BrokenMachine_VST3 --parallel

      - name: Validate and package v0.5.7 VST3
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: |
          $ErrorActionPreference = "Stop"
          $vst3 = Get-ChildItem build -Recurse -Directory -Filter "Broken Machine.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 bundle not found" }
          $binary = Get-ChildItem $vst3.FullName -Recurse -File | Where-Object { $_.Name -eq "Broken Machine.vst3" -or $_.Extension -eq ".dll" } | Select-Object -First 1
          if (-not $binary) { throw "VST3 binary not found" }

          $bytes = [IO.File]::ReadAllBytes($binary.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a -or [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw "Binary is not PE32+ x86-64"
          }
          $vi = (Get-Item $binary.FullName).VersionInfo
          $version = if ($vi.ProductVersion) { $vi.ProductVersion } else { $vi.FileVersion }
          if (-not $version.StartsWith("0.5.7")) { throw "Unexpected binary version $version" }

          $module = Get-ChildItem $vst3.FullName -Recurse -Filter moduleinfo.json | Select-Object -First 1
          if (-not $module) { throw "moduleinfo.json not found" }
          $moduleText = Get-Content $module.FullName -Raw
          if (-not $moduleText.Contains('"Version": "0.5.7"') -or -not $moduleText.Contains("UnknwnAWKND")) {
            throw "moduleinfo metadata mismatch"
          }

          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            "GetPluginFactory","InitDll","ExitDll","UnknwnAWKND",
            "DYNAMIC FX SENSITIVITY","REVERB + GHOST","TREMOLO DEPTH",
            "TONE + SPEAKER","SYNTH / MODEL","modelEnabled",
            "highProtect","reverbHighCutHz","tremoloDepth","tremoloRateHz",
            "DELETE PRESET","TYPE delete TO"
          )) {
            if (-not $ascii.Contains($marker)) { throw "Missing binary marker '$marker'" }
          }
          foreach ($removed in @(
            "FRONT LEVEL","DYNAMIC CONTROL","MACHINE DRIVE","DECAY SHAPE","PITCH DAMAGE",
            "DARK / BRIGHT","FINAL LEVEL","PICK PUNCH","SUSTAIN + REVERB",
            "HIGH-FREQ BREAKUP","MICRO-PITCH","DROPOUT","DELAY OFFSET",
            "FEEDBACK PITCH","FEEDBACK HOLD","OUTPUT + MODEL"
          )) {
            if ($ascii.Contains($removed)) { throw "Retired UI text survived compilation: $removed" }
          }

          $binaryHash = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "Broken Machine v0.5.7 validation",
            "PE32+ x86-64",
            "Version: $version",
            "Vendor: UnknwnAWKND",
            "Binary SHA-256: $binaryHash",
            "Startup/editor size: 1050 x 700 with delayed FL Studio reassertion",
            "All 45 UI knobs visible on one non-scrolling page",
            "Uniform knob component bounds: 88 x 78",
            "Uniform knob/readout/top-control font: 12 px",
            "Card heading font: 16.5 px",
            "All descriptors, MORE pages and retired controls removed",
            "Six saved default-on effect-card bypass parameters; Input and Output remain active",
            "Bypass transitions: 25 ms dry/processed crossfade",
            "79 legacy parameter IDs preserved in order; 5 v0.5.6 IDs appended",
            "Pitch-only Instability; full-depth two-control Tremolo; fixed 7-cent/8-ms Double",
            "Real reverb High Cut; extended Ghost and Reverb Drive ranges",
            "Feedback resonator removed from the compiled target",
            "Selected user presets can be deleted only after exact lowercase delete confirmation",
            "Delete confirmation is enforced in both the editor and preset backend"
          ) | Set-Content BINARY_VALIDATION.txt

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $vst3.FullName "package\Broken Machine.vst3" -Recurse
          @(
            "BROKEN MACHINE v0.5.7 — WINDOWS / FL STUDIO",
            "",
            "INSTALL",
            "1. Close FL Studio before replacing an existing Broken Machine build.",
            '2. Extract this ZIP and copy the entire "Broken Machine.vst3" folder to your VST3 location.',
            '   The common system location is C:\Program Files\Common Files\VST3.',
            "3. Re-open FL Studio and rescan plugins if needed.",
            "",
            "v0.5.7 INTERFACE",
            "- Opens at 1050 x 700 every time, including the delayed FL Studio size reassertion.",
            "- All 45 knobs use the same face, 88 x 78 component bounds and 12 px text.",

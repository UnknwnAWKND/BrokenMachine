name: Build Windows VST3 v0.3.1 Verified Source

on:
  workflow_dispatch:
  push:
    branches: [ "v0.3-tone-overhaul" ]
    paths:
      - "v0.3-source-correct/**"
      - "patches/v0.3.1-state-reset.patch"
      - ".github/workflows/build-v03-correct.yml"

permissions:
  contents: read
  issues: write

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report start
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          BrokenMachine v0.3.1 Windows build started.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}
          Base source SHA-256: 0fbe51b5364d8326e5b118a53c6742f08074f49ba63aad3de13e3354db7e8f3b
          Windows patched tree SHA-256: b59cf5677cef7e8b20398aa81d0aa482bd9bdf74225ecb32ce98ee4d95207bdf
          "@ | Set-Content start.txt
          gh issue create --title "v0.3.1 Windows build started #${{ github.run_number }}" --body-file start.txt

      - name: Verify base source and patch tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            Remove-Item build-error.txt -ErrorAction SilentlyContinue
            $names = @("part01.txt","part02.txt","part03.txt","part04.txt","part05a.txt","part05b1.txt","part05b2.txt","part05b3.txt","part06.txt")
            $encoded = ""
            foreach ($name in $names) {
              $p = Join-Path "v0.3-source-correct" $name
              if (-not (Test-Path $p)) { throw "Missing source piece $p" }
              $encoded += (Get-Content $p -Raw).Trim()
            }
            if ($encoded.Length -ne 69504) { throw "Unexpected base64 length $($encoded.Length)" }
            [IO.File]::WriteAllBytes("BrokenMachine-v0.3-source.zip", [Convert]::FromBase64String($encoded))
            $baseHash = (Get-FileHash "BrokenMachine-v0.3-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($baseHash -ne "0fbe51b5364d8326e5b118a53c6742f08074f49ba63aad3de13e3354db7e8f3b") { throw "Base source SHA mismatch: $baseHash" }
            Expand-Archive "BrokenMachine-v0.3-source.zip" "source-root" -Force
            if (-not (Test-Path "source-root\BrokenMachine-v0.3\CMakeLists.txt")) { throw "CMakeLists missing after extraction" }
            if (-not (Test-Path "patches\v0.3.1-state-reset.patch")) { throw "v0.3.1 patch missing" }
            & git apply --unsafe-paths --directory="source-root/BrokenMachine-v0.3" "patches/v0.3.1-state-reset.patch"
            if ($LASTEXITCODE -ne 0) { throw "git apply failed with exit code $LASTEXITCODE" }

            $root = (Resolve-Path "source-root\BrokenMachine-v0.3").Path
            $files = @(Get-ChildItem $root -Recurse -File)
            if ($files.Count -ne 39) { throw "Expected 39 patched source files, found $($files.Count)" }
            $rels = @($files | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\','/') })
            [Array]::Sort($rels, [StringComparer]::Ordinal)
            $manifest = ""
            foreach ($rel in $rels) {
              $h = (Get-FileHash (Join-Path $root $rel.Replace('/','\')) -Algorithm SHA256).Hash.ToLowerInvariant()
              $manifest += "$h  $rel`n"
            }
            $sha = [Security.Cryptography.SHA256]::Create()
            try { $treeHash = ([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($manifest)))).Replace('-','').ToLowerInvariant() }
            finally { $sha.Dispose() }
            Write-Host "Base source SHA-256: $baseHash"
            Write-Host "Windows patched tree SHA-256: $treeHash"
            if ($treeHash -ne "b59cf5677cef7e8b20398aa81d0aa482bd9bdf74225ecb32ce98ee4d95207bdf") { throw "Patched source tree mismatch: $treeHash" }
            if (-not ((Get-Content "source-root\BrokenMachine-v0.3\CMakeLists.txt" -Raw).Contains("VERSION 0.3.1"))) { throw "Patched CMake version is not 0.3.1" }
            $mustContain = @(
              @("Source\DSP\WowFlutter.cpp","if (wasActive)"),
              @("Source\DSP\MicroDouble.cpp","if (wasActive)"),
              @("Source\DSP\SpatialProcessor.cpp","if (wasActive)"),
              @("Source\DSP\ModelerProcessor.cpp","if (wasActive)"),
              @("Source\DSP\FeedbackResonator.cpp","if (wasActive)"),
              @("Source\DSP\SafetyLimiter.cpp","gain = 1.0f")
            )
            foreach ($check in $mustContain) {
              $text = Get-Content (Join-Path $root $check[0]) -Raw
              if (-not $text.Contains($check[1])) { throw "Patch marker '$($check[1])' missing from $($check[0])" }
            }
          }
          catch {
            @("Stage: source verification / v0.3.1 patch","Message: $($_.Exception.Message)","",($_ | Out-String)) | Set-Content build-error.txt
            throw
          }

      - name: Configure VS2022 x64
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: |
          $ErrorActionPreference = "Continue"
          & cmake -S . -B build -G "Visual Studio 17 2022" -A x64 *> configure.log
          $c = $LASTEXITCODE; Get-Content configure.log
          if ($c -ne 0) { @("Stage: CMake configure","Exit code: $c","",(Get-Content configure.log -Tail 300)) | Set-Content "..\..\build-error.txt"; exit $c }

      - name: Build VST3
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: |
          $ErrorActionPreference = "Continue"
          & cmake --build build --config Release --target BrokenMachine_VST3 --parallel *> build.log
          $c = $LASTEXITCODE; Get-Content build.log
          if ($c -ne 0) { @("Stage: C++ / VST3 compilation","Exit code: $c","",(Get-Content build.log -Tail 500)) | Set-Content "..\..\build-error.txt"; exit $c }

      - name: Validate and package
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $vst3 = Get-ChildItem build -Recurse -Directory -Filter "Broken Machine.vst3" | Select-Object -First 1
            if (-not $vst3) { throw "VST3 bundle not found" }
            $bin = Get-ChildItem $vst3.FullName -Recurse -File | Where-Object { $_.Name -eq "Broken Machine.vst3" -or $_.Extension -eq ".dll" } | Select-Object -First 1
            if (-not $bin) { throw "VST3 processor binary not found" }
            $bytes = [IO.File]::ReadAllBytes($bin.FullName)
            if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Binary is not Windows MZ/PE" }
            $pe = [BitConverter]::ToInt32($bytes,0x3c)
            if ($bytes[$pe] -ne 0x50 -or $bytes[$pe+1] -ne 0x45) { throw "Invalid PE signature" }
            $machine = [BitConverter]::ToUInt16($bytes,$pe+4)
            if ($machine -ne 0x8664) { throw ("Wrong PE machine 0x{0:x4}" -f $machine) }
            $vi = (Get-Item $bin.FullName).VersionInfo
            $version = $vi.ProductVersion; if ([string]::IsNullOrWhiteSpace($version)) { $version = $vi.FileVersion }
            if ([string]::IsNullOrWhiteSpace($version) -or -not $version.StartsWith("0.3.1")) { throw "Unexpected version '$version'" }
            $ascii = [Text.Encoding]::ASCII.GetString($bytes)
            $checks = @("Soft Focus","Distorted Halo","Bowed Static","Baritone Wire","Preamp First","Halo First","Parallel Rig","Modeler First")
            $missing = @($checks | Where-Object { -not $ascii.Contains($_) })
            if ($missing.Count) { throw "Missing expected strings: $($missing -join ', ')" }
            @("Broken Machine v0.3.1 validation","PE machine: 0x8664 x86-64","Version: $version","Windows patched tree SHA-256: b59cf5677cef7e8b20398aa81d0aa482bd9bdf74225ecb32ce98ee4d95207bdf","Verified strings: $($checks -join ', ')") | Set-Content BINARY_VALIDATION.txt
            New-Item -ItemType Directory -Force package | Out-Null
            Copy-Item $vst3.FullName "package\Broken Machine.vst3" -Recurse
            Copy-Item INSTALL.txt package\INSTALL.txt
            if (Test-Path RESEARCH.md) { Copy-Item RESEARCH.md package\RESEARCH.md }
            Copy-Item BINARY_VALIDATION.txt package\BINARY_VALIDATION.txt
            Compress-Archive "package\*" "BrokenMachine-v0.3.1-Windows-VST3.zip" -Force
          }
          catch { @("Stage: binary validation / packaging","Message: $($_.Exception.Message)","",($_ | Out-String)) | Set-Content "..\..\build-error.txt"; throw }

      - name: Package patched source
        shell: pwsh
        run: Compress-Archive "source-root\BrokenMachine-v0.3" "BrokenMachine-v0.3.1-source.zip" -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: BrokenMachine-v0.3.1-Windows-VST3
          path: source-root/BrokenMachine-v0.3/BrokenMachine-v0.3.1-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: BrokenMachine-v0.3.1-Source
          path: BrokenMachine-v0.3.1-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Report success
        if: ${{ success() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          BrokenMachine v0.3.1 Windows build succeeded.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}
          Base source SHA-256: 0fbe51b5364d8326e5b118a53c6742f08074f49ba63aad3de13e3354db7e8f3b
          Windows patched tree SHA-256: b59cf5677cef7e8b20398aa81d0aa482bd9bdf74225ecb32ce98ee4d95207bdf
          "@ | Set-Content success.txt
          gh issue create --title "v0.3.1 Windows build success #${{ github.run_number }}" --body-file success.txt

      - name: Report failure
        if: ${{ failure() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path build-error.txt)) { "Build failed without captured detail. Run ${{ github.run_id }}." | Set-Content build-error.txt }
          @"
          BrokenMachine v0.3.1 Windows build failed.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}

          "@ + (Get-Content build-error.txt -Raw) | Set-Content failure.txt
          gh issue create --title "v0.3.1 Windows build failure #${{ github.run_number }}" --body-file failure.txt

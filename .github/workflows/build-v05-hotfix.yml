name: Build Windows VST3 v0.5.2 Layout Redesign

on:
  workflow_dispatch:
  push:
    branches:
      - v0.5.2-layout-redesign
    paths:
      - "patches/v0.5.2-layout-redesign-chunks/**"
      - ".github/workflows/build-v05-hotfix.yml"

permissions:
  contents: read
  issues: write

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.5.1 and apply verified v0.5.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Reconstruct the exact v0.5.0 tree using the already-proven canonical workflow script.
          $yaml = Get-Content ".github/workflows/build-v05.yml" -Raw
          $m = [regex]::Match($yaml, '(?ms)^      - name: Reconstruct verified v0\.5 source\r?\n.*?^        run: \|\r?\n(?<script>.*?)(?=^      - name: Configure VS2022 x64)')
          if (-not $m.Success) { throw "Could not extract canonical v0.5 reconstruction script" }
          $lines = $m.Groups['script'].Value -split "`r?`n"
          $script = ($lines | ForEach-Object { if ($_.StartsWith('          ')) { $_.Substring(10) } else { $_ } }) -join "`n"
          $script = $script.Replace('--exclude="BUILD_STATUS.md"', '--exclude="*BUILD_STATUS.md"')
          $script = $script.Replace(',"MACHINE MONITOR"', '')
          $script = $script.Replace(',"PREAMP > MODELER > REVERB"', '')
          Set-Content reconstruct-v05.ps1 $script
          & ./reconstruct-v05.ps1
          if ($LASTEXITCODE -ne 0) { throw "v0.5 reconstruction failed: $LASTEXITCODE" }

          $root = (Resolve-Path "source-root\BrokenMachine-v0.3").Path

          function Get-ManifestHash([string]$projectRoot) {
            $files = @(
              Get-Item (Join-Path $projectRoot "Source\PluginProcessor.cpp")
              Get-Item (Join-Path $projectRoot "Source\PluginProcessor.h")
              Get-ChildItem (Join-Path $projectRoot "Source\DSP") -Recurse -File
              Get-ChildItem (Join-Path $projectRoot "Source\Parameters") -Recurse -File
            )
            $rels = @($files | ForEach-Object { $_.FullName.Substring($projectRoot.Length + 1).Replace('\','/') })
            [Array]::Sort($rels, [StringComparer]::Ordinal)
            $manifest = ""
            foreach ($rel in $rels) {
              $h = (Get-FileHash (Join-Path $projectRoot $rel.Replace('/','\')) -Algorithm SHA256).Hash.ToLowerInvariant()
              $manifest += "$h  $rel`n"
            }
            return ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($manifest)))).Replace('-','').ToLowerInvariant()
          }

          function Decode-Patch([string]$chunkDir, [string[]]$names, [int]$expectedLength,
                                [string]$transportExpected, [string]$gzipExpected,
                                [string]$patchExpected, [string]$stem) {
            $b64 = ""
            foreach ($name in $names) {
              $p = Join-Path $chunkDir $name
              if (-not (Test-Path $p)) { throw "Missing payload chunk $p" }
              $b64 += (Get-Content $p -Raw).Trim()
            }
            if ($b64.Length -ne $expectedLength) { throw "$stem payload length $($b64.Length), expected $expectedLength" }
            $transportHash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($b64)))).Replace('-','').ToLowerInvariant()
            if ($transportHash -ne $transportExpected) { throw "$stem transport hash mismatch: $transportHash" }
            $gz = "$stem.patch.gz"
            $patch = "$stem.patch"
            [IO.File]::WriteAllBytes($gz, [Convert]::FromBase64String($b64))
            $gzipHash = (Get-FileHash $gz -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($gzipHash -ne $gzipExpected) { throw "$stem gzip hash mismatch: $gzipHash" }
            $input = [IO.File]::OpenRead($gz)
            try {
              $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
              try {
                $output = [IO.File]::Create($patch)
                try { $gzip.CopyTo($output) } finally { $output.Dispose() }
              } finally { $gzip.Dispose() }
            } finally { $input.Dispose() }
            $patchHash = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($patchHash -ne $patchExpected) { throw "$stem patch hash mismatch: $patchHash" }
            return $patch
          }

          $v051 = Decode-Patch "patches\v0.5.1-refinement-chunks" @("part01.txt","part02.txt","part03.txt","part04.txt") 27956 `
            "e97575ad88b868558142eb73088c1404144fb0a8eaf75afe25e31ef33b7cb105" `
            "a077002a63c9fd23ffdebd2a0e83cce32dd3e6642830f7b1ce369d4a3f55f0ba" `
            "66f8cedb932e604edb22d6f7e0cf6b4ec7ec5cf72cacff5bd8c26f6dbed279cc" "v0.5.1"
          & git apply --unsafe-paths --directory="source-root/BrokenMachine-v0.3" $v051
          if ($LASTEXITCODE -ne 0) { throw "v0.5.1 patch apply failed: $LASTEXITCODE" }

          $engineBefore = Get-ManifestHash $root

          $v052 = Decode-Patch "patches\v0.5.2-layout-redesign-chunks" @("part01.txt","part02.txt","part03.txt","part04.txt") 23056 `
            "0d9775c334cb5d3cca4a08849469137b5e94e01e4854c588af1cf11fa54af55c" `
            "42d8360bb4295613c511ed82d6c1592209dee42f6693636328aefe6bac96e109" `
            "872703122ee6d3be3ed8ec321e38b528a50e1d1ef305439e6cd1e70ab1a781be" "v0.5.2"

          $changed = @(& git apply --numstat $v052 | ForEach-Object { ($_ -split "`t")[-1].Replace('\','/') })
          $allowed = @(
            "CMakeLists.txt","BUILD_WINDOWS.bat","INSTALL.txt","README.md","BUILD_STATUS.md",
            "Source/PluginEditor.cpp","Source/PluginEditor.h",
            "Source/UI/CustomLookAndFeel.cpp","Source/UI/CustomLookAndFeel.h"
          )
          $forbidden = @($changed | Where-Object { $_ -notin $allowed })
          if ($forbidden.Count) { throw "v0.5.2 touches forbidden paths: $($forbidden -join ', ')" }

          & git apply --unsafe-paths --directory="source-root/BrokenMachine-v0.3" $v052
          if ($LASTEXITCODE -ne 0) { throw "v0.5.2 patch apply failed: $LASTEXITCODE" }

          $engineAfter = Get-ManifestHash $root
          if ($engineAfter -ne $engineBefore) { throw "Audio engine changed: $engineBefore -> $engineAfter" }
          "Audio engine manifest unchanged: $engineAfter" | Set-Content source-validation.txt
          "Changed paths: $($changed -join ', ')" | Add-Content source-validation.txt
          Get-Content source-validation.txt

      - name: Static UI and compatibility audit
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: |
          $ErrorActionPreference = "Stop"
          $cmake = Get-Content "CMakeLists.txt" -Raw
          if (-not $cmake.Contains("VERSION 0.5.2")) { throw "CMake version is not 0.5.2" }
          if (-not $cmake.Contains('COMPANY_NAME "UnknwnAWKND"')) { throw "Vendor metadata changed" }

          $editor = Get-Content "Source\PluginEditor.cpp" -Raw
          $header = Get-Content "Source\PluginEditor.h" -Raw
          foreach ($marker in @("paintOverChildren","helpPopupVisible","getModuleCardBounds","SUSTAIN + REVERB","OUTPUT + MODEL","SAVE PRESET","FACTORY","USER")) {
            if (-not $editor.Contains($marker) -and -not $header.Contains($marker)) { throw "Missing v0.5.2 UI marker '$marker'" }
          }
          foreach ($legacy in @('"MORE"',"backButton","showingDetail","detailKnobs","helpTitleLabel","helpBodyLabel")) {
            if ($editor.Contains($legacy) -or $header.Contains($legacy)) { throw "Legacy detail/footer UI remains: $legacy" }
          }
          if ($editor.Contains("MachineMonitor")) { throw "Machine Monitor returned" }
          if (-not $editor.Contains("if (! helpMode)")) { throw "Help opt-in guard missing" }

          $visible = [regex]::Matches($editor, 'addKnob \(Params::ID::(\w+)') | ForEach-Object { $_.Groups[1].Value }
          if ($visible.Count -ne 56) { throw "Expected 56 visible knob bindings, found $($visible.Count)" }
          if (($visible | Sort-Object -Unique).Count -ne 56) { throw "Duplicate visible parameter binding found" }

          foreach ($tone in @("brightness","lowCutHz","highCutHz","speaker","body","bodyFreqHz","bite","biteFreqHz","size")) {
            if ($visible -notcontains $tone) { throw "Tone control missing: $tone" }
          }

          $paramsHeader = Get-Content "Source\Parameters\Parameters.h" -Raw
          $ids = [regex]::Matches($paramsHeader, 'inline constexpr auto\s+(\w+)\s*=') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if ($ids.Count -ne 74) { throw "Expected 74 parameter IDs, found $($ids.Count)" }
          $refs = @()
          Get-ChildItem Source -Recurse -Include *.cpp,*.h | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            [regex]::Matches($text, 'Params::ID::(\w+)') | ForEach-Object { $refs += $_.Groups[1].Value }
          }
          $undefined = @($refs | Sort-Object -Unique | Where-Object { $_ -notin $ids })
          if ($undefined.Count) { throw "Undefined parameter refs: $($undefined -join ', ')" }

          $processor = Get-Content "Source\PluginProcessor.cpp" -Raw
          foreach ($marker in @("case 0:","case 1:","case 2:","case 3:","Hairline","Ghost Bloom","Unstable Clean","Machine Collapse","saveUserPreset","loadUserPreset")) {
            if (-not $processor.Contains($marker)) { throw "Missing processor marker '$marker'" }
          }

      - name: Configure VS2022 x64
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 Release
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: cmake --build build --config Release --target BrokenMachine_VST3 --parallel

      - name: Validate and package
        shell: pwsh
        working-directory: source-root/BrokenMachine-v0.3
        run: |
          $ErrorActionPreference = "Stop"
          $vst3 = Get-ChildItem build -Recurse -Directory -Filter "Broken Machine.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 bundle not found" }
          $binary = Get-ChildItem $vst3.FullName -Recurse -File | Where-Object { $_.Name -eq "Broken Machine.vst3" -or $_.Extension -eq ".dll" } | Select-Object -First 1
          if (-not $binary) { throw "VST3 binary not found" }

          $bytes = [IO.File]::ReadAllBytes($binary.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a -or [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw "Binary is not PE32+ x86-64" }

          $vi = (Get-Item $binary.FullName).VersionInfo
          $version = if ($vi.ProductVersion) { $vi.ProductVersion } else { $vi.FileVersion }
          if (-not $version.StartsWith("0.5.2")) { throw "Unexpected binary version $version" }

          $module = Get-ChildItem $vst3.FullName -Recurse -Filter moduleinfo.json | Select-Object -First 1
          $moduleText = Get-Content $module.FullName -Raw
          if (-not $moduleText.Contains('"Version": "0.5.2"') -or -not $moduleText.Contains("UnknwnAWKND")) { throw "moduleinfo metadata mismatch" }

          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @("GetPluginFactory","InitDll","ExitDll","UnknwnAWKND","SAVE PRESET","SUSTAIN + REVERB","OUTPUT + MODEL")) {
            if (-not $ascii.Contains($marker)) { throw "Missing binary marker '$marker'" }
          }

          $binaryHash = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "Broken Machine v0.5.2 validation",
            "PE32+ x86-64",
            "Version: $version",
            "Vendor: UnknwnAWKND",
            "Binary SHA-256: $binaryHash",
            "74 parameter IDs preserved",
            "PluginProcessor + DSP + Parameters byte-manifest preserved from v0.5.1",
            "56 unique visible knob bindings",
            "No MORE/detail-page UI",
            "Contextual help popover verified"
          ) | Set-Content BINARY_VALIDATION.txt

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $vst3.FullName "package\Broken Machine.vst3" -Recurse
          Copy-Item INSTALL.txt package\INSTALL.txt
          Copy-Item BINARY_VALIDATION.txt package\BINARY_VALIDATION.txt
          if (Test-Path RESEARCH.md) { Copy-Item RESEARCH.md package\RESEARCH.md }
          Compress-Archive "package\*" "BrokenMachine-v0.5.2-Windows-VST3.zip" -Force
          Write-Host "Binary SHA-256: $binaryHash"

      - name: Package clean source
        shell: pwsh
        run: |
          $source = (Resolve-Path "source-root\BrokenMachine-v0.3").Path
          $destination = Join-Path (Get-Location) "source-package\BrokenMachine-v0.5.2"
          New-Item -ItemType Directory -Force $destination | Out-Null
          Get-ChildItem $source -Recurse -File | Where-Object {
            $_.FullName -notmatch '\\build\\|\\package\\' -and
            $_.Extension -notin @('.log','.zip','.obj','.pdb','.dll','.exe') -and
            $_.Name -ne 'BINARY_VALIDATION.txt'
          } | ForEach-Object {
            $relative = $_.FullName.Substring($source.Length + 1)
            $target = Join-Path $destination $relative
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $_.FullName $target
          }
          Compress-Archive "source-package\BrokenMachine-v0.5.2" "BrokenMachine-v0.5.2-source.zip" -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: BrokenMachine-v0.5.2-Windows-VST3
          path: source-root/BrokenMachine-v0.3/BrokenMachine-v0.5.2-Windows-VST3.zip
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: BrokenMachine-v0.5.2-Source
          path: BrokenMachine-v0.5.2-source.zip
          if-no-files-found: error

      - name: Report result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $status = "${{ job.status }}"
          gh issue create --title "v0.5.2 build $status" --body "Run ID: ${{ github.run_id }}`nCommit: ${{ github.sha }}"
